<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilkLove Cinematic Universe Hangman Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 5%;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5e3c7;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-width: 100vw;
        }

        h1 {
            color: #f390ee;
            font-size: clamp(22px, 5vw, 36px);
            margin-bottom: 1%;
        }

        img {
            width: 65w;
            max-width: 300px;
            height: auto;
            margin: 10px 0;
        }

        #keyboard {
            width: 100vw;
            max-width: 100vw;
            margin-top: 5vh;
        }

        button {
            flex: 1;
            max-width: 60px;
            padding: 14px 0;
            font-size: clamp(14px, 1.8vw, 20px);
            border: none;
            border-radius: 8px;
            background: #4ac378;
            color: white;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: #f5dfc6;
        }

        button:disabled {
            background: #f390ee;
            color: #fdda98;
        }

        /* wrong guesses in red */
        button.wrong:disabled {
            background: #e53935;
            color: #fff;
        }

        #message {
            margin-top: 5%;
            font-size: clamp(16px, 4.5vw, 22px);
            font-weight: bold;
            min-height: 10%;
        }

        #message.win {
            color: #f390ee;
            animation: pulse 0.8s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.25);
            }
        }

        #hangmanImage.celebrate {
            animation: bounce 0.6s ease infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            25% {
                transform: translateY(-20px) rotate(-4deg);
            }

            75% {
                transform: translateY(-20px) rotate(4deg);
            }
        }

        #restart {
            margin-top: 2%;
            max-height: 8vh;
            font-size: clamp(14px, 4vw, 18px);
            border-radius: 6px;
            border: none;
            background: rgb(246, 127, 30);
            color: white;
            cursor: pointer;
            display: flex;
        }

        #restart .fixed-bottom {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 4vw;
            height: 3vw;
            padding: 0;
            font-size: 16px;
            line-height: 2vw;
            border-radius: 6px;
            display: inline-block;
            white-space: nowrap;
            z-index: 1000;
        }

        #note {
            margin-top: 5%;
            margin-bottom: 5%;
            font-size: clamp(12px, 2vw, 12px);
            color: #f19e30;
            opacity: 0.8;
        }

        #word {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: clamp(22px, 6vw, 34px);
            margin: 15px 0;
            letter-spacing: 8px;
            word-wrap: break-word;
        }

        .char {
            display: inline-block;
            min-width: 28px;
            text-align: center;
            border-bottom: 2px solid #f7ab1e;
            padding-bottom: 4px;
        }

        .char.hidden {
            color: transparent;
        }

        .char.revealed {
            color: #000;
        }

        .separator {
            display: inline-block;
            min-width: 20px;
            color: #2db81b;
            font-weight: bold;
        }

        /* confetti */
        #confetti {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2000;
        }

        .confetti-piece {
            position: absolute;
            top: -20px;
            width: 10px;
            height: 16px;
            opacity: 0.9;
            animation-name: fall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }
    </style>
</head>

<body>

    <h1>
        <font style="color:#4ac378">Hangman</font> (Save MuvMuv)
    </h1>
    <p id="note">note:&ensp;/&ensp;represents word breaks </p>
    <img id="hangmanImage" src="images/muvmuv.png" alt="Hangman">

    <div id="word"></div>

    <div id="keyboard"></div>

    <div id="message"></div>

    <button id="restart" onclick="startGame()">Restart</button>

    <div id="confetti"></div>

    <script>
        const words = [
            "milklove",
            "ongsa",
            "sun",
            "earth",
            "23point5",
            "gmmtv",
            "ink",
            "pa",
            "bad buddy",
            "whale store xoxo",
            "professor",
            "tilt",
            "orbit",
            "meawnam",
            "wan",
            "grocery store",
            "shasha",
            "gorya",
            "girl rules",
            "blush blossom",
            "mini heart",
            "mimiv",
            "nong pansa",
            "phi pat",
            "pansa vosbein",
            "love pattranite",
            "chop oongsa mak mak mak mak mak",
            "cha cha cha",
            "sudteerak",
            "shot feel",
            "only champion",
            "cross the line",
            "ditto",
            "dear",
            "rafah",
            "size gap yuri",
            "muvmuv",
            "anyone taller than me is fine",
            "baby tee",
            "magic of zero",
            "vice versa",
            "fanmeet",
            "concert",
            "bobba eyes",
            "samoyed puppy",
            "pa family"
        ];
        const maxWrong = 6;

        let selectedWord = "";
        let guessedLetters = [];
        let wrongAttempts = 0;
        let gameOver = false;

        const images = [
            "images/muvmuv.png",
            "images/muvmuv1.png",
            "images/muvmuv2.png",
            "images/muvmuv3.png",
            "images/muvmuv4.png",
            "images/muvmuv5.png",
        ];
        const WIN_IMAGE = "images/win.png";
        const LOSE_IMAGE = "images/gameover.png";

        function startGame() {
            selectedWord = words[Math.floor(Math.random() * words.length)];
            guessedLetters = [];
            wrongAttempts = 0;
            gameOver = false;

            const msg = document.getElementById("message");
            msg.textContent = "";
            msg.classList.remove("win");

            const img = document.getElementById("hangmanImage");
            img.src = images[0];
            img.classList.remove("celebrate");

            document.getElementById("word").innerHTML = "";
            document.getElementById("confetti").innerHTML = "";
            document.getElementById("restart").style.display = "none";

            createKeyboard();
            updateWordDisplay();
        }

        function createKeyboard() {
            const keyboard = document.getElementById("keyboard");
            keyboard.innerHTML = "";

            const rows = [
                "qwertyuiop",
                "asdfghjkl",
                "zxcvbnm"
            ];

            rows.forEach(row => {
                const rowDiv = document.createElement("div");
                rowDiv.style.display = "flex";
                rowDiv.style.justifyContent = "center";
                rowDiv.style.gap = "6px";
                rowDiv.style.marginBottom = "6px";

                row.split("").forEach(letter => {
                    const btn = document.createElement("button");
                    btn.textContent = letter;
                    btn.id = "key-" + letter;
                    btn.onclick = () => handleGuess(letter);
                    rowDiv.appendChild(btn);
                });

                keyboard.appendChild(rowDiv);
            });
        }

        function handleGuess(letter) {
            if (gameOver || guessedLetters.includes(letter) || wrongAttempts >= maxWrong) return;

            guessedLetters.push(letter);

            const button = document.getElementById("key-" + letter);
            if (button) button.disabled = true;

            if (!selectedWord.includes(letter)) {
                wrongAttempts++;
                document.getElementById("hangmanImage").src = images[wrongAttempts];
                if (button) button.classList.add("wrong");
            }

            updateWordDisplay();
            checkGameStatus();
        }

        function updateWordDisplay() {
            const container = document.getElementById("word");
            container.innerHTML = "";

            selectedWord.split("").forEach(letter => {
                const span = document.createElement("span");

                if (letter === " ") {
                    span.textContent = "/";
                    span.className = "separator";
                } else if (guessedLetters.includes(letter)) {
                    span.textContent = letter;
                    span.className = "char revealed";
                } else {
                    span.textContent = "";
                    span.className = "char hidden";
                }

                container.appendChild(span);
            });
        }

        function checkGameStatus() {
            const won = selectedWord
                .split("")
                .every(letter => letter === " " || guessedLetters.includes(letter));

            if (won) {
                endGame("🎉 You Won! 🎉", true);
            } else if (wrongAttempts >= maxWrong) {
                endGame("Word was: " + selectedWord, false);
            }
        }

        function launchConfetti() {
            const container = document.getElementById("confetti");
            const colors = ["#f390ee", "#4ac378", "#f7ab1e", "#e53935", "#42a5f5", "#fdda98"];

            for (let i = 0; i < 80; i++) {
                const piece = document.createElement("div");
                piece.className = "confetti-piece";
                piece.style.left = Math.random() * 100 + "vw";
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = (2 + Math.random() * 2.5) + "s";
                piece.style.animationDelay = (Math.random() * 1.2) + "s";
                piece.style.transform = "rotate(" + Math.random() * 360 + "deg)";
                container.appendChild(piece);
            }

            setTimeout(() => { container.innerHTML = ""; }, 6000);
        }

        function endGame(message, won) {
            gameOver = true;

            const msg = document.getElementById("message");
            msg.innerHTML = message;

            const img = document.getElementById("hangmanImage");
            img.src = won ? WIN_IMAGE : LOSE_IMAGE;

            if (won) {
                msg.classList.add("win");
                img.classList.add("celebrate");
                launchConfetti();
            }

            document.querySelectorAll("#keyboard button").forEach(btn => btn.disabled = true);

            const restart = document.getElementById("restart");
            restart.style.display = "inline-block";
            restart.classList.add("fixed-bottom");
        }

        document.addEventListener("keydown", function (event) {
            const key = event.key.toLowerCase();
            if (key.length === 1 && key >= "a" && key <= "z") {
                handleGuess(key);
            }
        });

        startGame();
    </script>

</body>

</html>
